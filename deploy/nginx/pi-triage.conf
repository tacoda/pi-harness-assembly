# Case 7 — nginx as the public front door for the pi triage harness.
#
# Responsibilities of this config, in order:
#   1. Redirect all :80 traffic to :443, except the ACME webroot path
#      used by certbot for renewals.
#   2. Terminate TLS on :443.
#   3. Require HTTP basic auth. Even though ttyd has its own -c auth,
#      we don't want anonymous hits reaching the upstream at all.
#   4. Upgrade to WebSocket for the ttyd endpoint (the terminal itself
#      speaks WS; the initial page load is plain HTTP).
#   5. Proxy everything else through to ttyd on the internal network.
#
# The upstream name `ttyd:7681` resolves via docker compose's built-in
# DNS on the `edge` network defined in deploy/compose.yml. There is no
# host port published for ttyd, so this nginx block is the only way in.

upstream pi_triage_ttyd {
    server ttyd:7681;
    keepalive 8;
}

# --- :80 → :443 redirect, with ACME carve-out --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name triage.example.com;

    # certbot --webroot writes challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 main vhost ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name triage.example.com;

    # Certs come from certbot on the host, mounted into the container
    # read-only. Adjust the paths to match your issuer.
    ssl_certificate     /etc/letsencrypt/live/triage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triage.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # A pi harness has no legitimate reason to be indexed or embedded.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # HTTP basic auth. The htpasswd file is generated on the host with:
    #   htpasswd -c deploy/nginx/htpasswd alice
    # and mounted read-only into this container by compose.yml.
    auth_basic           "pi triage harness";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Long-lived terminal sessions. Keep the connection alive; don't
    # buffer output from the model.
    proxy_read_timeout   1h;
    proxy_send_timeout   1h;
    proxy_buffering      off;

    location / {
        proxy_pass         http://pi_triage_ttyd;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade — this is what actually carries the tty.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
